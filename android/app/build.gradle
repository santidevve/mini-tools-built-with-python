plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Load the WebView start URL from gradle.properties (START_URL).
def startUrl = (project.findProperty("START_URL") ?: "https://example.vercel.app").toString()

android {
    namespace 'com.publiccinema.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.publiccinema.app"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "APP_URL", "\"${startUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
}