<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Webhook Lab{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="{{ url_for('index') }}" class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Webhook Lab</span>
      </a>
      <nav class="topbar-nav">
        <a href="{{ url_for('index') }}" class="nav-link">Bins</a>
        <a href="{{ url_for('api_list_bins') }}" class="nav-link" target="_blank" rel="noopener">API</a>
      </nav>
    </div>
  </header>

  <main class="container main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>Webhook Lab &mdash; Local HTTP Request &amp; Webhook Inspector</span>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
