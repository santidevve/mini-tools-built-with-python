[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "public-cinema"
version = "0.1.0"
description = "Legal Public-Domain & Creative Commons Movie Recommender and Downloader powered by Internet Archive."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
