<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Public Cinema — Free Legal Public-Domain &amp; CC Movies{% endblock %}</title>
  <meta name="description" content="Discover, preview, and legally download classic public-domain and Creative Commons feature films from the Internet Archive.">
  <link rel="manifest" href="{{ url_for('web_manifest') }}">
  <meta name="theme-color" content="#0a0c10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Public Cinema">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark" aria-hidden="true">PC</span>
        <span>Public Cinema</span>
      </a>
      <div class="header-meta">
        <span class="legal-badge" title="Verified Public Domain &amp; Creative Commons films">
          &#10003; 100% Legal &bull; Public Domain &amp; CC
        </span>
        <nav aria-label="Primary navigation">
          <a class="nav-link" href="{{ url_for('index') }}">Browse Catalog</a>
          <a class="nav-link" href="{{ url_for('sources_page') }}">Film Sources</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="site-main">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>Public Cinema &mdash; Curated Public-Domain &amp; Creative Commons Cinema</span>
      <span>Direct MP4 streams &amp; downloads hosted legally by the <a href="https://archive.org" target="_blank" rel="noopener noreferrer">Internet Archive</a>.</span>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
